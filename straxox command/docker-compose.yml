version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Straxon Labs — Production Stack
#
# Services:
#   nginx    → Reverse proxy + static frontend (port 80)
#   backend  → Node.js / Express API (internal only)
#   pulse    → Go real-time WebSocket server (internal only)
#   redis    → Message bus for Pulse metrics
#
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Nginx (entry point) ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - pulse
    restart: unless-stopped

  # ── Node.js Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # NOT exposed to host — Nginx proxies to it
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/straxon_v2?schema=public}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      REDIS_URL: redis://redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - frontend_dist:/app/dist  # serve built frontend via Nginx
    depends_on:
      - db
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Go Pulse Service ──────────────────────────────────────────────────────
  pulse:
    build:
      context: ./straxon-pulse
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      REDIS_URL: redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  # ── PostgreSQL with pgvector ──────────────────────────────────────────────
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: straxon_v2
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes  # persistence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db_data:        # PostgreSQL database files
  redis_data:     # Redis AOF persistence
  frontend_dist:  # Vite build output shared between backend and nginx
