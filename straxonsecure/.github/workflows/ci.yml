name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Check
        run: npm run build
        
      - name: Run Unit Tests
        run: npx vitest run

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Verify supabaseAdmin boundaries
        run: |
          echo "Checking for leaked supabaseAdmin imports in client routes..."
          if grep -rq "supabaseAdmin" src/routes/ ; then
            echo "::error:: SECURITY VIOLATION: supabaseAdmin found outside src/server!"
            exit 1
          fi
          echo "supabaseAdmin boundary check passed."
