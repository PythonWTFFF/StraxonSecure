version: '3.8'

services:
  frontend:
    build:
      context: ./straxonsecure
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
    depends_on:
      - ml-engine

  ml-engine:
    build:
      context: ./straxon-ml-engine
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      # Mount Docker socket so the ML Engine can spawn Pentest Lab containers
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
