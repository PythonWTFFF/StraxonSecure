name: Enterprise Production Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend
  ML_ENGINE_IMAGE_NAME: ${{ github.repository }}/ml-engine

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest,${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Build and push ML Engine
        uses: docker/build-push-action@v5
        with:
          context: ../straxon-ml-engine
          file: ../straxon-ml-engine/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.ML_ENGINE_IMAGE_NAME }}:latest,${{ env.REGISTRY }}/${{ env.ML_ENGINE_IMAGE_NAME }}:${{ github.sha }}

  deploy-to-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        
      - name: Set Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update Kubernetes Deployments with new Image tags
        run: |
          # Replace 'latest' with the specific git sha to force a rolling update
          sed -i "s|image: straxon/frontend:latest|image: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}|g" k8s/frontend-deployment.yaml
          sed -i "s|image: straxon/ml-engine:latest|image: ${{ env.REGISTRY }}/${{ env.ML_ENGINE_IMAGE_NAME }}:${{ github.sha }}|g" k8s/ml-engine-deployment.yaml

      - name: Apply Manifests
        run: |
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/ml-engine-deployment.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Verify Deployment Rollout
        run: |
          kubectl rollout status deployment/straxon-frontend --timeout=120s
          kubectl rollout status deployment/straxon-ml-engine --timeout=120s
