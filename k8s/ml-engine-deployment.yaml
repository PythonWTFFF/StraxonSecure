apiVersion: apps/v1
kind: Deployment
metadata:
  name: straxon-ml-engine
  labels:
    app: straxon-ml-engine
spec:
  replicas: 1 # Needs to be 1 to handle host Docker Socket properly without conflicts unless using a swarm/DIND orchestrator
  selector:
    matchLabels:
      app: straxon-ml-engine
  template:
    metadata:
      labels:
        app: straxon-ml-engine
    spec:
      containers:
      - name: straxon-ml-engine
        image: straxon/ml-engine:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
        envFrom:
        - configMapRef:
            name: straxon-config
        - secretRef:
            name: straxon-secrets
        volumeMounts:
        - mountPath: /var/run/docker.sock
          name: docker-sock
        resources:
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: Socket
---
apiVersion: v1
kind: Service
metadata:
  name: straxon-ml-engine-service
spec:
  selector:
    app: straxon-ml-engine
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
  type: ClusterIP
